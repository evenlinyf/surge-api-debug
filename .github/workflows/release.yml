name: Publish release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  validate:
    if: github.event.deleted != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Validate paired release versions
        id: version
        shell: bash
        run: |
          expected_tag=""
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            expected_tag="$GITHUB_REF_NAME"
          fi
          release_tag="$(node scripts/check-release.js "$expected_tag")"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
      - name: Run tests
        run: node --test tests/*.test.js
      - name: Check coverage (minimum 95%)
        run: node --test scripts/coverage-api-debug.js

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reject an existing tag pointing to another commit
        shell: bash
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            tag_commit="$(git rev-parse "$RELEASE_TAG^{commit}")"
            if [[ "$tag_commit" != "$(git rev-parse HEAD)" ]]; then
              echo "::error::Tag $RELEASE_TAG already points to another commit."
              exit 1
            fi
          fi
      - name: Create tag and publish Release with Module attachment
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" surge_api_debug.sgmodule \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes \
            --latest
      - name: Verify published Module and pinned JavaScript
        shell: bash
        run: |
          download_dir="$(mktemp -d)"
          gh release download "$RELEASE_TAG" \
            --pattern surge_api_debug.sgmodule --dir "$download_dir"
          cmp surge_api_debug.sgmodule "$download_dir/surge_api_debug.sgmodule"
          curl --fail --location --retry 5 --retry-all-errors --max-time 30 \
            "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$RELEASE_TAG/surge_api_debug.js" \
            --output "$download_dir/surge_api_debug.js"
          cmp surge_api_debug.js "$download_dir/surge_api_debug.js"
          echo "Published and verified $RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
